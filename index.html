<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>レインボーバス時刻表</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="レインボーバス">
<meta name="theme-color" content="#f6f7fb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12131a" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#1b1f2a;--sub:#6b7280;--line:#e5e7eb;--accent:#e2457a;--accent2:#7c4dff;--past:#b6bac4;--soft:#fdeef3}
@media (prefers-color-scheme:dark){:root{--bg:#12131a;--card:#1c1e28;--ink:#eef0f6;--sub:#9aa0ad;--line:#2c2f3b;--past:#555a66;--soft:#3a1f2a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
 padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding:16px 14px 40px}
header{display:flex;align-items:center;gap:10px;margin:4px 2px 14px}
.logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#ff5f6d,#ffc371 30%,#4cd964 55%,#38a1ff 75%,#7c4dff);flex:none}
h1{font-size:18px;margin:0;line-height:1.2}
h1 small{display:block;font-size:12px;color:var(--sub);font-weight:500}
.clock{margin-left:auto;text-align:right;font-variant-numeric:tabular-nums;font-size:20px;font-weight:700}
.clock small{display:block;font-size:11px;color:var(--sub);font-weight:500}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;color:var(--sub);font:inherit;font-weight:600;padding:9px 0;border-radius:9px;cursor:pointer}
.seg button.on{background:var(--ink);color:var(--bg)}
.seg button .auto{font-size:10px;font-weight:600;margin-left:4px;opacity:.8}
label.lbl{display:block;font-size:12px;color:var(--sub);margin:14px 2px 6px}
select{width:100%;font:inherit;font-size:16px;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);appearance:none;
 background-image:linear-gradient(45deg,transparent 50%,var(--sub) 50%),linear-gradient(135deg,var(--sub) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.next{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;position:relative;overflow:hidden}
.next::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(var(--accent),var(--accent2))}
.next .k{font-size:12px;color:var(--sub)}
.next .big{display:flex;align-items:baseline;gap:12px;margin-top:2px}
.next .t{font-size:46px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.next .cd{font-size:16px;font-weight:700;color:var(--accent)}
.next .after{margin-top:6px;font-size:14px;color:var(--sub);font-variant-numeric:tabular-nums}
.next .after b{color:var(--ink);font-weight:600;margin-right:10px}
.end{font-size:15px;color:var(--sub);padding:6px 0}
.list{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.row{display:flex;border-top:1px solid var(--line);min-height:44px}
.row:first-child{border-top:0}
.row .h{flex:none;width:52px;display:flex;align-items:center;justify-content:center;font-weight:700;font-variant-numeric:tabular-nums;background:rgba(127,127,127,.06)}
.row .ms{display:flex;flex-wrap:wrap;gap:4px 6px;padding:8px 10px;align-items:center}
.m{font-variant-numeric:tabular-nums;font-size:17px;padding:3px 7px;border-radius:8px}
.m.past{color:var(--past)}
.m.near{background:var(--accent);color:#fff;font-weight:800}
.row.cur .h{color:var(--accent)}
.note{font-size:11.5px;color:var(--sub);line-height:1.6;margin:16px 4px 0}
.note a{color:inherit}
.tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:999px;background:var(--soft);color:var(--accent);font-weight:700;margin-left:6px;vertical-align:2px}
</style>
</head>
<body>
<div class="wrap">
 <header>
  <div class="logo" aria-hidden="true"></div>
  <h1>お台場レインボーバス<small>品川・台場循環 時刻表</small></h1>
  <div class="clock"><span id="clock">--:--</span><small id="date"></small></div>
 </header>

 <div class="seg" role="tablist">
  <button id="b-wd" data-d="wd">平日</button>
  <button id="b-we" data-d="we">土日祝</button>
 </div>

 <label class="lbl" for="stop">乗車するバス停</label>
 <select id="stop"></select>

 <div class="next" id="next"></div>
 <div class="list" id="list"></div>

 <p class="note">
  出典：<a href="https://www.km-bus.tokyo/route/odaiba/timetable-shinagawa.php">京急バス お台場レインボーバス 時刻表</a>（2025年4月1日改正ダイヤ）。<br>
  日本時間で現在時刻を判定し、土日・祝日は自動で「土日祝」ダイヤに切り替わります（年末年始などの特別ダイヤは対象外）。道路状況で遅れることがあります。最新情報は公式サイトでご確認ください。
 </p>
</div>

// 国民の祝日（振替休日・国民の休日を含む）

]);

const $ = id => document.getElementById(id);
const store = { get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}} };

function nowJST(){
 const p = Object.fromEntries(new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Tokyo",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit",weekday:"short",hourCycle:"h23"})
  .formatToParts(new Date()).map(x=>[x.type,x.value]));
 return {ymd:`${p.year}-${p.month}-${p.day}`, m:+p.month, d:+p.day, wd:p.weekday, h:+p.hour, min:+p.minute, s:+p.second};
}
function autoDay(n){ return (n.wd==="Sat"||n.wd==="Sun"||HOLIDAYS.has(n.ymd)) ? "we" : "wd"; }
const toMin = t => +t.slice(0,2)*60 + +t.slice(3);

let day = null, manual = false, stop = +(store.get("rb-stop") ?? 0) || 0, lastKey = "";

// stop select
(function(){
 const sel = $("stop"); let g=null, gname="";
 STOPS.forEach(([name,grp],i)=>{
  if(grp!==gname){ g=document.createElement("optgroup"); g.label=grp; sel.appendChild(g); gname=grp; }
  const o=document.createElement("option"); o.value=i; o.textContent=name; g.appendChild(o);
 });
 if(stop<0||stop>=STOPS.length) stop=0;
 sel.value=stop;
 sel.onchange=()=>{ stop=+sel.value; store.set("rb-stop",stop); lastKey=""; tick(true); };
})();
document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{ day=b.dataset.d; manual = day!==autoDay(nowJST()); lastKey=""; tick(true); });

function tick(scroll){
 const n = nowJST();
 const auto = autoDay(n);
 if(!manual || day===null) day = auto;
 const dows={Sun:"日",Mon:"月",Tue:"火",Wed:"水",Thu:"木",Fri:"金",Sat:"土"};
 $("clock").textContent = `${String(n.h).padStart(2,"0")}:${String(n.min).padStart(2,"0")}`;
 $("date").textContent = `${n.m}/${n.d}（${dows[n.wd]}）${HOLIDAYS.has(n.ymd)?"祝":""}`;
 ["wd","we"].forEach(k=>{
  const b=$("b-"+k); b.classList.toggle("on",day===k);
  b.innerHTML = (k==="wd"?"平日":"土日祝") + (auto===k?'<span class="auto">今日</span>':"");
 });

 const times = DATA[day][stop];
 const nowM = n.h*60+n.min, nowS = nowM*60+n.s;
 const isToday = day===auto;
 let idx = isToday ? times.findIndex(t=>toMin(t)>=nowM) : -1;
 // 今日のダイヤでなければ、時刻ベースで最寄りの便を表示
 if(!isToday) idx = times.findIndex(t=>toMin(t)>=nowM);

 // next card
 const nx=$("next");
 const label = STOPS[stop][0].endsWith("（到着）") ? "次の到着" : "次の発車";
 if(idx>=0){
  const t=times[idx], diff = toMin(t)*60 - nowS;
  const mm = Math.max(0,Math.ceil(diff/60));
  const cd = diff<=0 ? "まもなく" : (mm>=60 ? `あと${Math.floor(mm/60)}時間${mm%60}分` : `あと${mm}分`);
  const after = times.slice(idx+1, idx+4);
  nx.innerHTML = `<div class="k">${label}${isToday?"":'<span class="tag">'+(day==="wd"?"平日":"土日祝")+'ダイヤ表示中</span>'}</div>
   <div class="big"><div class="t">${t}</div>${isToday?`<div class="cd">${cd}</div>`:""}</div>
   ${after.length?`<div class="after">その後 ${after.map(a=>"<b>"+a+"</b>").join("")}</div>`:`<div class="after">この便が最終です</div>`}`;
 } else {
  nx.innerHTML = `<div class="k">${label}</div><div class="end">本日の運行は終了しました。<br>始発は <b>${times[0]}</b> です（${(day==="wd"?"平日":"土日祝")}ダイヤ）。</div>`;
 }

 // list (re-render when the highlighted bus changes)
 const key = day+"|"+stop+"|"+idx;
 if(key!==lastKey){
  lastKey=key;
  const byH={}; times.forEach((t,i)=>{ (byH[t.slice(0,2)] ||= []).push([t,i]); });
  const curH = idx>=0 ? times[idx].slice(0,2) : null;
  $("list").innerHTML = Object.keys(byH).sort().map(h=>`<div class="row${h===curH?" cur":""}" data-h="${h}"><div class="h">${+h}</div><div class="ms">${
   byH[h].map(([t,i])=>`<span class="m ${i===idx?"near":(idx<0||i<idx)?"past":""}">${t.slice(3)}</span>`).join("")}</div></div>`).join("");
  if(scroll!==false && curH){
   const el=document.querySelector(`.row[data-h="${curH}"]`);
   if(el){ const r=el.getBoundingClientRect(); if(r.top<0||r.bottom>innerHeight) el.scrollIntoView({block:"center",behavior:"smooth"}); }
  }
 }
}
tick(true);
setInterval(()=>tick(false), 10000);
document.addEventListener("visibilitychange",()=>{ if(!document.hidden){ manual=false; lastKey=""; tick(true); }});
if("serviceWorker" in navigator){ addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{})); }
</script>
